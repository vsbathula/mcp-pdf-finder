[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "mcp-pdf-finder"
version = "0.1.0"
description = "MCP server for searching and reading PDF documents"
requires-python = ">=3.11"

dependencies = [
    "mcp",
    "pypdf",
    "python-dotenv",
    "groq",
    "slack-bolt",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]